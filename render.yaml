services:
  - type: web
    name: specforge-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: SpecForge
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: FRONTEND_URLS
        value: https://specforge.vercel.app,http://localhost:5173
      - key: VISION_ENABLED
        value: "True"
      - key: VISION_MAX_PAGES
        value: "10"
      - key: VISION_DPI
        value: "200"
      - key: API_KEY
        sync: false
