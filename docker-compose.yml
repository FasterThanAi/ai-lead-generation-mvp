# Full stack on one machine: PostgreSQL (pgvector) + Redis + API + web.
#   cp .env.docker.example .env   # then set SECRET_KEY, POSTGRES_PASSWORD, API keys
#   docker compose up --build
#   open http://localhost:8080
name: leadgen

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: leadgen
      POSTGRES_USER: leadgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadgen -d leadgen"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://leadgen:${POSTGRES_PASSWORD}@db:5432/leadgen
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (openssl rand -hex 32)}
      FRONTEND_URLS: ${PUBLIC_WEB_URL:-http://localhost:8080}
      PUBLIC_API_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://backend:8000
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  pgdata:
