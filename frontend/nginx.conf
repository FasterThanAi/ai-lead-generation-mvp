# Rendered by the nginx image's envsubst step: ${API_UPSTREAM} comes from the environment.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # nginx drops inherited add_header in any location that sets its own, so
  # every location includes the same snippet.
  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  # Hashed build assets never change: cache for a year.
  location /assets/ {
    expires 1y;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Same-origin API: no CORS, cookies and tokens stay on one host.
  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 180s;
    client_max_body_size 20m;
  }

  # SPA routing; index.html must never be cached so new deploys load at once.
  location / {
    try_files $uri /index.html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
}
