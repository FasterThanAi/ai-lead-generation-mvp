[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
  "B008",   # FastAPI Depends()/Query() in defaults is idiomatic
  "B904",
  "E501",   # long prompt strings are intentional
  "S101",   # asserts in tests
  "S311",
  "S608",   # SQL built from constant identifiers in migrations
  "S110",
  "SIM102",
  "SIM105",
  "SIM108",
  "SIM113",
  "SIM114",
  "SIM115",
  "S104",
  "S105",
  "B005",
  "UP017",
  "UP041",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
